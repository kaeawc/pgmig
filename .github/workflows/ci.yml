name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the run still going: only the latest commit matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets --profile ci -- -D warnings
      # Function complexity (threshold in clippy.toml).
      - run: cargo clippy --locked --workspace --lib --bins --profile ci -- -A clippy::all -D clippy::cognitive_complexity

  # Dependency policy (deny.toml): one version per crate, RustSec advisories, licenses, sources.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  # Every test against embedded pgmem, including the corpus and its known-failures ratchet.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --workspace --cargo-profile ci --profile ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-pgmem
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # The same tests against every supported Postgres major version: proves the corpus describes
  # real Postgres, not just pgmem.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ["15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          cache-on-failure: true
          save-if: false
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --workspace --cargo-profile ci --profile ci
        env:
          PGMIG_TEST_DSN: host=127.0.0.1 port=5432 user=postgres

  # TLS against Postgres 18 with a throwaway CA: verify-full connects with the right root and is
  # refused with a wrong one (tests in crates/pgmig-conn/tests/it/tls.rs, skipped elsewhere).
  tls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          cache-on-failure: true
          save-if: false
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest
      - name: Start Postgres 18 with TLS
        run: |
          scripts/tls-test-certs.sh "$RUNNER_TEMP/tls"
          # Postgres refuses a key others can read; 999 is the image's postgres user.
          sudo chown 999:999 "$RUNNER_TEMP/tls/server.key"
          sudo chmod 600 "$RUNNER_TEMP/tls/server.key"
          docker run -d --name pg-tls -p 5433:5432 \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$RUNNER_TEMP/tls:/tls:ro" \
            postgres:18 \
            -c ssl=on -c ssl_cert_file=/tls/server.pem -c ssl_key_file=/tls/server.key
          # Over TCP: the entrypoint's init server listens on the Unix socket only.
          for _ in $(seq 60); do
            if docker exec pg-tls pg_isready -h localhost -U postgres; then exit 0; fi
            sleep 1
          done
          docker logs pg-tls
          exit 1
      - run: cargo nextest run --locked -p pgmig-conn --cargo-profile ci --profile ci
        env:
          PGMIG_TEST_TLS_DSN: port=5433 user=postgres
          PGMIG_TEST_TLS_ROOT: ${{ runner.temp }}/tls/ca.pem
          PGMIG_TEST_TLS_WRONG_ROOT: ${{ runner.temp }}/tls/wrong.pem

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --release -p pgmig-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgmig-linux-x86_64
          path: target/release/pgmig
