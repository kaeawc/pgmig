name: Release

# Releases happen when a version bump lands on main (scripts/release.sh opens that PR): the
# workspace version has no `vX.Y.Z` tag yet, so this builds binaries, publishes the crates to
# crates.io and creates the GitHub release (which creates the tag). Pushing a `vX.Y.Z` tag by hand
# does the same for that tag. Run it by hand (workflow_dispatch) for a dry run on any branch:
# binaries are built and the crates are packaged and verified, but nothing is uploaded.
#
# Every step is safe to rerun: scripts/publish.sh skips crates already on crates.io, and an
# existing GitHub release gets its assets replaced.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      # true: build, package and upload. dry-run: build and package only. skip: nothing to do.
      mode: ${{ steps.v.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ]; then
            mode=dry-run
          elif [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match workspace version $version"
              exit 1
            fi
            mode=release
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" > /dev/null 2>&1; then
            echo "v$version is already tagged: no release"
            mode=skip
          else
            mode=release
          fi
          echo "mode=$mode" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.mode != 'skip'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --locked --profile dist -p pgmig-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="pgmig-v$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            cp "../target/$TARGET/dist/pgmig.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "../target/$TARGET/dist/pgmig" "$name/"
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  package:
    needs: version
    if: needs.version.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      # Builds every crate from its packaged .crate, as crates.io users will.
      - run: cargo package --locked --workspace

  # crates.io trusted publishing (OIDC): each crate's trusted publisher on crates.io is
  # repository kaeawc/pgmig, workflow release.yml, environment crates-io.
  publish:
    needs: [version, build, package]
    if: needs.version.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: scripts/publish.sh

  github-release:
    needs: [version, publish]
    if: needs.version.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          # Notes: this version's CHANGELOG.md section, else GitHub's generated notes.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          # Creates the tag at this commit when it does not exist yet (release from main).
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "pgmig $tag" "${notes[@]}" "${prerelease[@]}"
