doctest = false

[dependencies]
pgmig-config = { workspace = true }
pgmig-conn = { workspace = true }
pgmig-diff = { workspace = true }
pgmig-inspect = { workspace = true }
pgmig-migrate = { workspace = true }
pgmig-model = { workspace = true }
pgmig-plan = { workspace = true }
pgmig-shadow = { workspace = true }
pgmig-sql = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
pgmem = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
